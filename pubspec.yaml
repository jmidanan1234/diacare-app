name: diacare
description: DiaCare - Barangay Health Worker Diabetes Monitoring App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.3
  intl: ^0.19.0
  uuid: ^4.5.1
  fl_chart: ^0.68.0
  crypto: ^3.0.3
  flutter_local_notifications: ^17.2.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  path_provider: ^2.1.6
  # Firebase Cloud Messaging — for server/BHN-originated push alerts, once
  # the backend exists. Local notifications (above) remain the channel for
  # alerts generated entirely on-device (offline risk classification).
  # Requires running `flutterfire configure` to generate
  # lib/firebase_options.dart before this will initialize successfully —
  # see the comment in lib/services/fcm_service.dart.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Firestore is the store now, replacing sqflite. Its own offline cache
  # keeps the app usable without signal - the reason SQLite was chosen -
  # while making the same records visible to the RHU dashboard, which a
  # device-local database never could.
  cloud_firestore: ^5.4.4
  # A BHW signs in with a username, so the password is checked by
  # /api/bhw-login and this exchanges the custom token it returns for a
  # real Firebase identity.
  firebase_auth: ^5.3.1
  http: ^1.2.2

dev_dependencies:
  # Generates the Android launcher icons from assets/images/logo.png into
  # every mipmap density. Doing it by hand means five hand-resized PNGs
  # that drift apart the next time the logo changes.
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# ================================================================
# LAUNCHER ICON
#
# Regenerate after changing the logo:
#   dart run flutter_launcher_icons
#
# adaptive_icon_background is the green the app's own header uses, so the
# icon sits on brand colour rather than the white plate Android would
# otherwise put behind a transparent logo on newer devices.
# ================================================================
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#0F2E28"
  adaptive_icon_foreground: "assets/images/logo.png"
  # The foreground is padded so the logo is not clipped by the circular
  # and squircle masks different Android launchers apply.
  adaptive_icon_foreground_inset: 18
  remove_alpha_ios: true
