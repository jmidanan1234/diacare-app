name: diacare
description: DiaCare - Barangay Health Worker Diabetes Monitoring App
publish_to: 'none'
version: 1.0.7+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.3
  path: ^1.9.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.3
  intl: ^0.19.0
  uuid: ^4.5.1
  fl_chart: ^0.68.0
  crypto: ^3.0.3
  flutter_local_notifications: ^17.2.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  path_provider: ^2.1.6
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  http: ^1.2.2

dev_dependencies:
  # Generates the Android launcher icons from assets/images/logo.png into
  # every mipmap density. Doing it by hand means five hand-resized PNGs
  # that drift apart the next time the logo changes.
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# ================================================================
# LAUNCHER ICON
#
# Regenerate after changing the logo:
#   dart run flutter_launcher_icons
#
# adaptive_icon_background is the green the app's own header uses, so the
# icon sits on brand colour rather than the white plate Android would
# otherwise put behind a transparent logo on newer devices.
# ================================================================
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/ic_launcher_legacy.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/ic_launcher_foreground.png"
  remove_alpha_ios: true
